[package]
name = "hyprlayer-app"
description = "Hyprlayer — native desktop app for spec-driven development"
authors = ["BrightBlock"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "Hyprlayer"
path = "src/main.rs"

[lib]
name = "hyprlayer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hyprlayer-client.workspace = true
hyprlayer-core = { workspace = true, features = ["specta"] }
hyprlayer-proto.workspace = true
hyprlayer-server.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
dirs.workspace = true
gethostname = "1"
which = "7"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-mcp-bridge = "0.11"
tauri-plugin-notification = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
log = "0.4"
base64 = "0.22"
semver = "1"
sha2 = "0.10"
uuid = { version = "1.23.3", features = ["v4"] }
# cookie 0.18.1 conflicts with time 0.3.48.
time = { version = ">=0.3.36, <0.3.48", default-features = false, features = ["formatting", "macros"] }
tauri-plugin-clipboard-manager = "2"
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk-sys = "2.0"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
hyprlayer-e2e = { path = "../crates/hyprlayer-e2e" }
tempfile = "3"
