<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark squircle backdrop with a subtle top-down sheen. -->
    <linearGradient id="bg" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1d24" />
      <stop offset="1" stop-color="#0a0b0d" />
    </linearGradient>
    <!-- Brand gradient shared by every layer, matching the in-app logo. -->
    <linearGradient id="mark" x1="260" y1="300" x2="764" y2="722" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc" />
      <stop offset="0.55" stop-color="#60a5fa" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
  </defs>

  <!-- Inset to Apple's macOS icon grid: an 824×824 rounded square centered in
       the 1024 canvas (~100px transparent margin), so the icon reads the same
       size as other apps in the Dock / app switcher rather than oversized. -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)" />

  <!-- The isometric stack, centered: translate(176,176) scale(21) over the
       32×32 mark space (content spans y 6–26, centered at 16,16). -->
  <g transform="translate(176 176) scale(21)">
    <path d="M16 26 4 20l12-6 12 6-12 6Z" fill="url(#mark)" opacity="0.45" />
    <path d="M16 22 4 16l12-6 12 6-12 6Z" fill="url(#mark)" opacity="0.7" />
    <path d="M16 18 4 12l12-6 12 6-12 6Z" fill="url(#mark)" />
  </g>
</svg>
