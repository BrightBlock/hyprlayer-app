[package]
name = "hyprlayer-desktop"
description = "The Hyprlayer GPUI desktop client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "hyprlayer_desktop"

[[bin]]
name = "hyprlayer-native"
path = "src/main.rs"

[dependencies]
# Pinned with hyprlayer-ui's gpui-component (ADR-0013).
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui-component = "=0.11.0"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
hyprlayer-client.workspace = true
hyprlayer-core.workspace = true
hyprlayer-models.workspace = true
hyprlayer-proto.workspace = true
hyprlayer-server.workspace = true
hyprlayer-ui.workspace = true
serde_json.workspace = true
tokio.workspace = true
log = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"
