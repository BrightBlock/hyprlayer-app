[package]
name = "hyprlayer-e2e"
description = "End-to-end harness: the real hyprlayer-server binary in a sandboxed profile, driven over its socket"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
hyprlayer-core.workspace = true
hyprlayer-proto.workspace = true
hyprlayer-server.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false }

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"
