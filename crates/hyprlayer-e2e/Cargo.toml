[package]
name = "hyprlayer-e2e"
description = "End-to-end harness: the real hyprlayer-server binary in a sandboxed profile, driven over its socket"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
hyprlayer-core.workspace = true
hyprlayer-proto.workspace = true
hyprlayer-server.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
rusqlite = { version = "0.40.1", features = ["bundled"] }
gpui = { package = "gpui-pre", version = "=0.3.14", features = ["test-support"], optional = true }
hyprlayer-desktop = { path = "../hyprlayer-desktop", optional = true }

[features]
# The GPUI tier. Off by default so the server's release gate never builds GPUI.
gpui = ["dep:gpui", "dep:hyprlayer-desktop"]

[dev-dependencies]
ghostty-vt.workspace = true
hyprlayer-client = { path = "../hyprlayer-client" }
reqwest = { version = "0.12", default-features = false }
vt100 = "0.16"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[test]]
name = "gpui_skeleton"
required-features = ["gpui"]
