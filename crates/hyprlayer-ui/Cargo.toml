[package]
name = "hyprlayer-ui"
description = "Hyprlayer GPUI primitives: theme tokens, type scale, row tiers, dialog, popover, icons, fonts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Pinned together: gpui-component 0.11.0 is built against exactly gpui-pre 0.3.14 (ADR-0013).
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui-component = "=0.11.0"
gpui-kit-assets = "=0.11.0"
