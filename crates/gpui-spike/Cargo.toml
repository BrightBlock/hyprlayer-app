[package]
name = "gpui-spike"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
ghostty-vt.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui-component = { version = "=0.11.0", features = ["tree-sitter-rust", "tree-sitter-markdown"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
hyprlayer-core.workspace = true
hyprlayer-models.workspace = true
hyprlayer-proto.workspace = true
hyprlayer-server.workspace = true
notify-rust = "4"
tokio.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
