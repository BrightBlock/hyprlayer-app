[package]
name = "hyprlayer-server"
description = "The Hyprlayer runtime as a process: one profile, the profile lock, one local socket"
# Released on its own cadence (`server-v<version>`); bump it for any change
# under crates/hyprlayer-{server,core,models,proto} (ADR-0009).
version = "0.9.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "hyprlayer_server"
path = "src/lib.rs"

[[bin]]
name = "hyprlayer-server"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
hyprlayer-core.workspace = true
hyprlayer-models.workspace = true
hyprlayer-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
dirs.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std", "ansi", "tracing-log"] }
tracing-appender = "0.2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
hyprlayer-core = { workspace = true, features = ["test-support"] }
tempfile = "3"
