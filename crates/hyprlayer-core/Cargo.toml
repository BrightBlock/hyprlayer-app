[package]
name = "hyprlayer-core"
description = "Core logic for the Hyprlayer desktop app (no Tauri dependencies)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
specta = ["dep:specta", "hyprlayer-models/specta"]
test-support = []

[dependencies]
hyprlayer-models.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
dirs.workspace = true
tracing.workspace = true
which = "7"
shellexpand = "3"
regex = "1"
serde_yaml = "0.9"
git2 = { version = "0.19", default-features = false }
memchr = "2"
aho-corasick = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
walkdir = "2"
dunce = "1"
sha2 = "0.10"
globset = "0.4"
toml = "0.8"
toml_edit = "0.22"
notify = "8"
notify-debouncer-full = "0.5"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"], optional = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.23.3", features = ["v4"] }

portable-pty = "0.9"
base64 = "0.22"
fs4 = { version = "1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
log = { version = "0.4", features = ["std"] }
# Adds tokio::time::pause/advance for the reservation-TTL test only.
tokio = { workspace = true, features = ["test-util"] }

[target."cfg(windows)".dependencies]
junction = "2.0.0"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target."cfg(unix)".dependencies]
libc = "0.2"
