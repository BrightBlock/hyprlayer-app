[package]
name = "hyprlayer-core"
description = "Core logic for the Hyprlayer desktop app (no Tauri dependencies)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Derive specta::Type on IPC-facing types so the Tauri shell can export
# TypeScript bindings without mirroring DTOs.
specta = ["dep:specta"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
dirs.workspace = true
tracing.workspace = true
which = "7"
shellexpand = "3"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"], optional = true }

[dev-dependencies]
tempfile = "3"
