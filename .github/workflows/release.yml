name: Release

# Push a tag like `v0.2.1` (use `./scripts/release.sh patch|minor|major`).
# Parallel platform builds — macOS arm64 (Apple Silicon) and
# Windows x64 NSIS — both ed25519-signed for the in-app updater. The release
# job stitches them into one GitHub Release; bump-website writes the updater
# manifest + changelog to brightblock.ai. Running apps see the new version via
# the in-app Update pill within a few minutes (Vercel's cache TTL on the JSON).
#
# Binaries live on GitHub Releases; only the tiny signed manifest
# (latest.json) lives on brightblock.ai, so the endpoint can be re-pointed or
# cached independently of the release assets.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read           # this (private) repo: read only; the release is
                           # created on the PUBLIC releases repo via a PAT.

env:
  # Hard-coded so PRs from forks can't override.
  # Source stays in this private repo; binaries are published to a separate
  # PUBLIC repo so their release-asset URLs are anonymously downloadable (a
  # private repo's assets 404 without an auth token — and the updater fetches
  # them unauthenticated).
  RELEASES_REPO: BrightBlock/hyprlayer-releases
  TAP_REPO: BrightBlock/homebrew-tap
  WEBSITE_REPO: jtsiros/brightblock.ai
  # The site uses Astro base:/hyprlayer + a Vercel rewrite (/hyprlayer/:p -> /:p),
  # so a file at public/updates/X is served at /hyprlayer/updates/X — which is
  # the endpoint in tauri.conf.json. Do NOT add a hyprlayer/ segment here.
  WEBSITE_MANIFEST_PATH: public/updates/latest.json
  WEBSITE_CHANGELOG_PATH: public/updates/changelog.json

jobs:
  # Cheap fast-fail: type-check the frontend before spinning up the slower
  # native runners.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ─── macOS arm64 (Apple Silicon) ──────────────────────────────────
  # Apple Silicon only — Intel Macs are no longer supported. tauri builds the
  # aarch64 slice directly (no lipo). Output is one Hyprlayer_<v>_aarch64.dmg
  # plus the Hyprlayer.app.tar.gz the updater consumes; the manifest carries a
  # single darwin-aarch64 key.
  build-mac:
    needs: validate
    runs-on: macos-latest
    outputs:
      version:      ${{ steps.meta.outputs.version }}
      dmg_name:     ${{ steps.meta.outputs.dmg_name }}
      dmg_sha:      ${{ steps.hashes.outputs.dmg_sha }}
      tarball_name: ${{ steps.hashes.outputs.tarball_name }}
      sig:          ${{ steps.hashes.outputs.sig }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version + filenames
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_name=Hyprlayer_${VERSION}_aarch64.dmg" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: pnpm install --frozen-lockfile
      - name: Configure Apple signing & notarization (optional)
        # No certs yet → ad-hoc signing ('-'). Add the APPLE_* repo secrets
        # later and this step switches to Developer ID signing + notarization
        # with no workflow change. tauri treats set-but-empty APPLE_* vars as
        # "sign with this", so we only forward them when actually present.
        env:
          APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:     ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY:              ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER:           ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT:      ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          addenv() { printf '%s<<__HL_EOF__\n%s\n__HL_EOF__\n' "$1" "$2" >> "$GITHUB_ENV"; }
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Apple certificate configured; Developer ID signing."
            addenv APPLE_CERTIFICATE          "$APPLE_CERTIFICATE"
            addenv APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            addenv APPLE_SIGNING_IDENTITY     "${APPLE_SIGNING_IDENTITY:--}"
          else
            echo "No Apple certificate secret; ad-hoc signing ('-')."
            addenv APPLE_SIGNING_IDENTITY "-"
          fi
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_CONTENT" ]; then
            echo "App Store Connect key configured; notarization on."
            mkdir -p ~/.appstoreconnect/private_keys
            printf '%s' "$APPLE_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_"$APPLE_API_KEY".p8
            addenv APPLE_API_KEY      "$APPLE_API_KEY"
            addenv APPLE_API_ISSUER   "$APPLE_API_ISSUER"
            addenv APPLE_API_KEY_PATH "$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8"
          else
            echo "No App Store Connect key; skipping notarization."
          fi
      - name: Build & sign (arm64)
        env:
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target aarch64-apple-darwin
      - name: Locate updater tarball + read signature
        id: hashes
        run: |
          BUNDLE_DIR=target/aarch64-apple-darwin/release/bundle
          ls -la "$BUNDLE_DIR/macos" "$BUNDLE_DIR/dmg"
          # Glob the tarball (always <productName>.app.tar.gz) rather than
          # hardcoding the product name, mirroring how the Windows job finds
          # its installer — so a productName change can't silently break this.
          TARBALL=$(ls "$BUNDLE_DIR"/macos/*.app.tar.gz | head -n1)
          echo "tarball_name=$(basename "$TARBALL")" >> "$GITHUB_OUTPUT"
          # sha256 of the arm64 .dmg — consumed by the Homebrew cask bump.
          DMG=$(ls "$BUNDLE_DIR"/dmg/*.dmg | head -n1)
          echo "dmg_sha=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          SIG=$(cat "${TARBALL}.sig")
          { echo 'sig<<EOF'; echo "$SIG"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: hyprlayer-${{ steps.meta.outputs.version }}-mac
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  # ─── Windows x64 (NSIS) ───────────────────────────────────────────
  # --bundles nsis: the NSIS installer is the only Windows format the updater
  # can drop in place (installMode: passive in tauri.conf.json runs it
  # silently). createUpdaterArtifacts also emits the <setup>.exe.sig.
  build-windows:
    needs: validate
    runs-on: windows-latest
    outputs:
      version:    ${{ steps.meta.outputs.version }}
      setup_name: ${{ steps.find.outputs.setup_name }}
      sig:        ${{ steps.hashes.outputs.sig }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: meta
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: pnpm install --frozen-lockfile
      - name: Build & sign (NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis
      - name: Locate installer
        id: find
        shell: bash
        run: |
          BUNDLE_DIR=target/release/bundle/nsis
          ls -la "$BUNDLE_DIR"
          SETUP=$(ls "$BUNDLE_DIR"/*-setup.exe | head -n1)
          echo "setup_name=$(basename "$SETUP")" >> "$GITHUB_OUTPUT"
          echo "setup_path=$SETUP" >> "$GITHUB_ENV"
      - name: Read updater signature
        id: hashes
        shell: bash
        run: |
          SIG=$(cat "${setup_path}.sig")
          { echo 'sig<<EOF'; echo "$SIG"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: hyprlayer-${{ steps.meta.outputs.version }}-windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig

  # ─── Stitch artifacts into a GitHub Release ───────────────────────
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hyprlayer-${{ needs.build-mac.outputs.version }}-mac
          path: mac
      - uses: actions/download-artifact@v4
        with:
          name: hyprlayer-${{ needs.build-windows.outputs.version }}-windows
          path: win
      - name: Create GitHub Release (on the public releases repo)
        # The release + assets go to the PUBLIC RELEASES_REPO, not this private
        # source repo. The default GITHUB_TOKEN can't write across repos, so
        # this uses RELEASES_REPO_TOKEN (a PAT with contents:write on it).
        # --target main creates the tag on the releases repo's default branch.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          VERSION: ${{ needs.build-mac.outputs.version }}
          DMG: ${{ needs.build-mac.outputs.dmg_name }}
          SETUP: ${{ needs.build-windows.outputs.setup_name }}
        run: |
          NOTES=$(cat <<EOF
          ## Install

          ### macOS (Apple Silicon)

          Download \`${DMG}\` below, drag to /Applications. Apple Silicon only;
          builds aren't notarized yet, so strip the quarantine flag once so
          Gatekeeper lets it launch:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/Hyprlayer.app
          \`\`\`

          ### Windows (x64)

          Download and run \`${SETUP}\`. It isn't code-signed yet, so
          SmartScreen shows an "unknown publisher" prompt — choose
          **More info → Run anyway**.

          ## Updates

          After the first install the app self-updates: future releases land
          via the in-app **Update** pill (bottom-left of the sidebar).
          EOF
          )
          gh release create "v${VERSION}" \
            --repo "${{ env.RELEASES_REPO }}" \
            --target main \
            --title "v${VERSION}" \
            --notes "$NOTES" \
            mac/dmg/*.dmg mac/macos/* \
            win/*-setup.exe win/*-setup.exe.sig

  # ─── Bump the updater manifest + changelog on brightblock.ai ──────
  # Two files land in the brightblock.ai repo (Vercel auto-deploys on push):
  #   * public/hyprlayer/updates/latest.json   — signed updater manifest.
  #   * public/hyprlayer/updates/changelog.json — copied verbatim from this
  #                                               repo's changelog.json.
  bump-website:
    needs: [build-mac, build-windows, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.WEBSITE_REPO }}
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: site
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Write update manifest + changelog
        env:
          MAC_SIG:      ${{ needs.build-mac.outputs.sig }}
          TARBALL_NAME: ${{ needs.build-mac.outputs.tarball_name }}
          WIN_SIG:      ${{ needs.build-windows.outputs.sig }}
          SETUP_NAME:   ${{ needs.build-windows.outputs.setup_name }}
        run: |
          cd site
          VERSION="${{ needs.build-mac.outputs.version }}"
          BASE="https://github.com/${{ env.RELEASES_REPO }}/releases/download/v$VERSION"
          mkdir -p "$(dirname "${{ env.WEBSITE_MANIFEST_PATH }}")"
          # macOS is Apple Silicon only (darwin-aarch64); Windows gets the NSIS
          # setup .exe. Intel Macs (darwin-x86_64) are no longer published, so
          # any lingering Intel install just sees "no update".
          cat > "${{ env.WEBSITE_MANIFEST_PATH }}" <<JSON
          {
            "version": "$VERSION",
            "notes": "See https://github.com/${{ env.RELEASES_REPO }}/releases/tag/v$VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$MAC_SIG",
                "url": "$BASE/$TARBALL_NAME"
              },
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "$BASE/$SETUP_NAME"
              }
            }
          }
          JSON
          cp ../app/changelog.json "${{ env.WEBSITE_CHANGELOG_PATH }}"
          # Vercel only deploys commits whose author email is tied to a Vercel
          # account; a bot/noreply author makes the deploy fail with a "set your
          # commit email" status. Use the project owner's email so it deploys.
          git config user.name  "jtsiros"
          git config user.email "jon@brightblock.ai"
          git add "${{ env.WEBSITE_MANIFEST_PATH }}" "${{ env.WEBSITE_CHANGELOG_PATH }}"
          git commit -m "hyprlayer: updater bump to $VERSION + changelog"
          git push

  # ─── Bump the Homebrew cask ───────────────────────────────────────
  # Updates Casks/hyprlayer-desktop.rb in the tap to the new version + the
  # arm64 .dmg's sha256, so `brew upgrade --cask hyprlayer-desktop` tracks
  # releases. Needs HOMEBREW_TAP_TOKEN (a PAT with contents:write on the tap).
  bump-tap:
    needs: [build-mac, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Bump cask (version + dmg sha256)
        env:
          VERSION: ${{ needs.build-mac.outputs.version }}
          DMG_SHA: ${{ needs.build-mac.outputs.dmg_sha }}
        run: |
          cd tap
          CASK=Casks/hyprlayer-desktop.rb
          sed -i -E "s|^  version \".*\"|  version \"$VERSION\"|" "$CASK"
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"$DMG_SHA\"|" "$CASK"
          # Fail-fast: refuse to push a cask whose sha didn't update exactly,
          # rather than silently disable checksum verification for users.
          if ! grep -qE "^  sha256 \"${DMG_SHA}\"\$" "$CASK"; then
            echo "✗ cask sha256 did not update as expected"; grep -n sha256 "$CASK"; exit 1
          fi
          git config user.name  "jtsiros"
          git config user.email "jon@brightblock.ai"
          git add "$CASK"
          git commit -m "hyprlayer-desktop $VERSION"
          git push
