name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Test
        # Windows can't *run* the src-tauri lib test binary: it links the
        # webview runtime and the loader fails with STATUS_ENTRYPOINT_NOT_FOUND
        # before any test executes. ADR 0001 only guarantees the headless core
        # tests cross-OS; the app's lone test (the tauri-specta bindings export)
        # runs on Linux/macOS, where the drift check below also lives.
        run: cargo test ${{ matrix.os == 'windows-latest' && '-p hyprlayer-core' || '--workspace' }} --locked

      - name: Bindings are up to date
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code src/lib/bindings.ts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  bundle:
    name: Debug bundle (smoke)
    if: github.ref == 'refs/heads/main'
    needs: [rust, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Build unsigned debug bundle
        # Override createUpdaterArtifacts → false: this smoke job has no signing
        # key, and Tauri errors ("public key found, but no private key") when
        # asked to produce updater artifacts unsigned. Signing is exercised by
        # the release workflow, which has the key. shell: bash keeps the inline
        # JSON quoting identical on the Windows runner (default pwsh would not).
        shell: bash
        run: pnpm tauri build --debug --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          CI: true
