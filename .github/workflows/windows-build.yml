name: windows-build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v0.5.5)
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Disable updater artifacts (signing happens on the Mac)
        shell: pwsh
        run: |
          $confPath = "src-tauri/tauri.conf.json"
          $txt = Get-Content $confPath -Raw
          $new = $txt -replace '"createUpdaterArtifacts"\s*:\s*true', '"createUpdaterArtifacts": false'
          if ($new -eq $txt) {
            Write-Warning "createUpdaterArtifacts:true not found; build will need a signing key and likely fail"
          }
          [System.IO.File]::WriteAllText($confPath, $new, (New-Object System.Text.UTF8Encoding($false)))

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: tauri build --bundles nsis
        run: pnpm tauri build --bundles nsis

      - name: Locate installer
        id: locate
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*-setup.exe" -ErrorAction Stop |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "no *-setup.exe found" }
          echo "path=$($setup.FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.locate.outputs.path }}
          retention-days: 7
