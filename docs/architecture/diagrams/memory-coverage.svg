tem,'Segoe UI',sans-serif;font-size:11.5px;font-weight:400;fill:#a8a6a2">['workstream', id] prefix the listing sits under; on window focus once the listing is 5 s old; and from the</text><text x="62.0" y="758.0" text-anchor="start" style="font-family:'Inter','Inter Variable',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11.5px;font-weight:400;fill:#a8a6a2">refresh button. It is fetched only while the view is open or a document preview is showing.</text><rect x="810.0" y="676.0" width="750.0" height="108.0" rx="10" style="fill:#141414;stroke:#333333;stroke-width:1"/><rect x="810.0" y="688.0" width="3.0" height="84.0" rx="2" style="fill:#a78bfa;stroke:none;stroke-width:1"/><text x="832.0" y="704.0" text-anchor="start" style="font-family:'Inter','Inter Variable',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;font-weight:600;fill:#e8e6e2">Where it can still be stale</text><text x="832.0" y="726.0" text-anchor="start" style="font-family:'Inter','Inter Variable',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11.5px;font-weight:400;fill:#a8a6a2">Another workstream of the same project writes memory while you watch this one; a Claude Code terminal writes,</text><text x="832.0" y="742.0" text-anchor="start" style="font-family:'Inter','Inter Variable',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11.5px;font-weight:400;fill:#a8a6a2">and emits no session events; or Claude's optional post-turn extraction writes after turnDone. Focus, the refresh</text><text x="832.0" y="758.0" text-anchor="start" style="font-family:'Inter','Inter Variable',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11.5px;font-weight:400;fill:#a8a6a2">button or reopening the view picks up all three.</text></svg>
