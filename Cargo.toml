[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/hyprlayer-core",
    "crates/hyprlayer-models",
    "crates/hyprlayer-proto",
    "crates/hyprlayer-server",
    "crates/hyprlayer-e2e",
]

[workspace.package]
version = "0.8.22"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/brightblock-ai/hyprlayer-app"

[workspace.dependencies]
hyprlayer-core = { path = "crates/hyprlayer-core" }
hyprlayer-models = { path = "crates/hyprlayer-models" }
hyprlayer-proto = { path = "crates/hyprlayer-proto" }
hyprlayer-server = { path = "crates/hyprlayer-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "sync", "time", "fs", "net"] }
dirs = "5"
tracing = { version = "0.1", features = ["log"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
