[workspace]
resolver = "2"
members = ["src-tauri", "crates/hyprlayer-core"]

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/brightblock-ai/hyprlayer-app"

[workspace.dependencies]
hyprlayer-core = { path = "crates/hyprlayer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "fs"] }
dirs = "5"
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
